name: scRNA-seq QC Python and browser tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Compile Python sources
      run: python -m compileall -q agents scrna_qc.py qc_metrics.py cli.py enrichment.py simulator.py

    - name: Check browser JavaScript
      run: |
        node --check web/app.js
        node --test tests/qc-browser.test.js

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Audit initialization smoke test
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        assert AuditLogger.verify_integrity() is True
        print('Audit initialized successfully')
        "
