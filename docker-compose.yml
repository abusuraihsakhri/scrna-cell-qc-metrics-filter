version: '3.8'

services:
  scrna-cell-qc-metrics-filter:
    build: .
    container_name: scrna-cell-qc-metrics-filter
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=scrna-cell-qc-metrics-filter-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
